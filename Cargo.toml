[package]
name = "ufo-types"
version = "0.10.2"
edition = "2024"
rust-version = "1.85"
authors = ["Brian Horakh <brian@promptexecution.com>"]
license = "MIT"
repository = "https://github.com/PromptExecution/ufo-types"
description = "UFO stereotypes, Satisfies<T> constraint trait, DARE proposal types, and ISO wrappers for the Tax-Lawyer platform + b00t governance"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1.0"
