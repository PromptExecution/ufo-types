[package]
name = "ufo-types"
version = "0.11.0"
edition = "2024"
rust-version = "1.85"
authors = ["Brian Horakh <brian@promptexecution.com>"]
license = "MIT"
repository = "https://github.com/PromptExecution/ufo-types"
description = "UFO stereotypes, Satisfies<T> constraint trait, DARE proposal types, and ISO wrappers for the Tax-Lawyer platform + b00t governance"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
schemars = { version = "0.8", features = ["derive"] }
# `sysml-v2-parser` is not wasm32-compatible, so `sysml` is opt-in rather
# than a default feature — consumers that don't need SysML v2 syntax
# validation (most of them) don't pay for it.
sysml-v2-parser = { version = "0.54", optional = true }

[features]
sysml = ["dep:sysml-v2-parser"]

[dev-dependencies]
serde_json = "1.0"
