[package]
name = "ufo-types"
version = "0.11.0"
edition = "2024"
rust-version = "1.85"
authors = ["Brian Horakh <brian@promptexecution.com>"]
license = "MIT"
repository = "https://github.com/PromptExecution/ufo-types"
description = "UFO stereotypes, Satisfies<T> constraint trait, DARE proposal types, and ISO wrappers for the Tax-Lawyer platform + b00t governance"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
schemars = { version = "0.8", features = ["derive"] }
rpassword = "7"
shellexpand = "3.1"
# Optional OS keyring backend for `pipeline_secrets::SecretSource::Keyring`
# (elasticdotventures/_b00t_#1251 extraction) — mirrors b00t-cli's existing
# `keyring` feature name/gate, but as a real dependency: b00t-cli's own
# `keyring = []` feature is a no-op stub with no crate behind it, so that
# code path has never actually compiled there. This makes it real.
keyring = { version = "3", optional = true }
# `sysml-v2-parser` is not wasm32-compatible, so `sysml` is opt-in rather
# than a default feature — consumers that don't need SysML v2 syntax
# validation (most of them) don't pay for it.
sysml-v2-parser = { version = "0.54", optional = true }
# Optional PyO3 binding (P3, `elasticdotventures/_b00t_#1177`) — cross-runtime
# validation: the same Rust-owned `validate_sysml_v2` callable identically
# from Python, following common-core/critter-keeper's proven pyo3+maturin
# pattern (`src/python.rs`, `#[pymodule] fn _core`).
pyo3 = { version = "0.27", features = ["extension-module"], optional = true }
# W3C SCXML statechart document model (P5, `elasticdotventures/_b00t_#1177`)
# — the shared, standards-based representation state-machine-shaped types
# across the b00t ecosystem compile to/from, replacing ad hoc per-domain
# renderers. Pinned to an exact version: small bus factor (2 contributors,
# 0.x semver) per this epic's own crate-evaluation research.
scxml = { version = "=0.2.2", optional = true }

[features]
sysml = ["dep:sysml-v2-parser"]
python = ["dep:pyo3", "sysml"]
statechart = ["dep:scxml"]
keyring = ["dep:keyring"]

[dev-dependencies]
serde_json = "1.0"
tempfile = "3"
